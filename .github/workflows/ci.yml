name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install copy-space (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: CLI smoke (installed entrypoints)
        run: |
          copyspace-validate --help >/dev/null
          copyspace-solve --help >/dev/null
          copyspace-pilot --help >/dev/null
          mkdir -p tmp
          copyspace-solve scripts/scheduler/tests/demo_instance.json --out tmp/ci_schedule.json --solver baseline
          copyspace-validate scripts/scheduler/tests/demo_instance.json tmp/ci_schedule.json --quiet

      - name: Build (bins)
        run: make bins

      - name: ART ABI doc sync
        run: python3 scripts/check_art_doc_sync.py --doc doc/abi_artifacts.md

      - name: Test (non-TDD)
        run: make test

      - name: TDD
        run: make tdd

      - name: Scheduler v0 tests
        run: ./scripts/test_scheduler.sh
