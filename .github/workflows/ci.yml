name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install copy-space (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: CLI smoke (installed entrypoints)
        run: |
          copyspace-validate --help >/dev/null
          copyspace-solve --help >/dev/null
          copyspace-pilot --help >/dev/null
          mkdir -p tmp
          copyspace-solve scripts/scheduler/tests/demo_instance.json --out tmp/ci_schedule.json --solver baseline
          copyspace-validate scripts/scheduler/tests/demo_instance.json tmp/ci_schedule.json --quiet

      - name: Build (bins)
        run: make bins

      - name: ART ABI doc sync
        run: python3 scripts/check_art_doc_sync.py --doc doc/abi_artifacts.md

      - name: Test (non-TDD)
        run: make test

      - name: TDD
        run: make tdd

      - name: Scheduler v0 tests
        run: ./scripts/test_scheduler.sh

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build (bins)
        run: make bins

      - name: Bench smoke (core benches)
        run: |
          mkdir -p tmp
          scripts/bench/run.sh --bench all --out tmp/bench_smoke.csv \
            --repeat 1 \
            --copies-list 16 \
            --chunk-bytes-list 16 \
            --src-stride-bytes-list 4096 \
            --mode-list random \
            --seed-list 1 \
            --len-bytes-list 1024 \
            --life-list 100
          python3 scripts/bench/summarize.py --in tmp/bench_smoke.csv --top 3 > tmp/bench_smoke.md
          cat tmp/bench_smoke.md >> "$GITHUB_STEP_SUMMARY"

      - name: Bench smoke (scheduler unified CSV)
        run: |
          mkdir -p tmp
          scripts/bench/run.sh --bench scheduler --out tmp/sched_smoke.csv --repeat 1
          python3 scripts/bench/summarize.py --in tmp/sched_smoke.csv --top 5 > tmp/sched_smoke.md
          cat tmp/sched_smoke.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke
          path: |
            tmp/bench_smoke.csv
            tmp/bench_smoke.md
            tmp/sched_smoke.csv
            tmp/sched_smoke.md

  native-build-matrix:
    name: Native build (CMake) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build/cmake

      - name: Build (CMake)
        run: cmake --build build/cmake --config Release

      - name: List produced binaries
        run: |
          cmake -E echo "Contents of build/bin:"
          cmake -E ls build/bin
