[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "copy-space"
version = "0.1.3"
description = "Copy-Space: validated scheduling toolkit (STRICT1, volume-based)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
  "Topic :: Software Development :: Testing",
]
dependencies = []
license = {text = "Apache-2.0"}

[project.urls]
Homepage = "https://github.com/bortoq/copy-space"
Repository = "https://github.com/bortoq/copy-space"
Documentation = "https://github.com/bortoq/copy-space/tree/main/doc"
BenchHistory = "https://bortoq.github.io/copy-space/"
ReleaseNotes = "https://github.com/bortoq/copy-space/releases"

[project.scripts]
copyspace-validate = "copyspace.v0.validate:main"
copyspace-solve = "copyspace.v0.solve:main"
copyspace-pilot = "copyspace.v0.pilot:main"
copyspace-csv-to-instance = "copyspace.v0.csv_to_instance:main"
copyspace-lines-to-schedule = "copyspace.v0.lines_to_schedule:main"
copyspace-bench-scheduler = "copyspace.v0.bench_scheduler:main"
copyspace-demo-scheduler = "copyspace.v0.demo_scheduler:main"
copyspace-bench-core = "copyspace.v0.bench_core:main"

[project.optional-dependencies]
viz = [
  "streamlit",
  "matplotlib",
]

[tool.setuptools.packages.find]
include = ["copyspace*"]
